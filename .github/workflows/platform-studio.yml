name: platform-studio

on:
  workflow_dispatch:
    inputs:
      native_gpu:
        description: 'Run the Windows native GPU gate on a self-hosted GPU runner'
        required: true
        type: boolean
        default: false
  push:
    paths:
      - 'CMakeLists.txt'
      - 'engine/**'
      - 'editors/**'
      - 'tests/**'
      - '.github/workflows/platform-studio.yml'

concurrency:
  group: platform-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Windows software OpenGL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mesaVersion = '26.2.0'
          $mesaUrl = "https://github.com/pal1000/mesa-dist-win/releases/download/$mesaVersion/mesa3d-$mesaVersion-release-msvc.7z"
          $mesaArchive = Join-Path $env:RUNNER_TEMP "mesa3d-$mesaVersion-release-msvc.7z"
          Invoke-WebRequest -Uri $mesaUrl -OutFile $mesaArchive
          if ((Get-FileHash $mesaArchive -Algorithm SHA256).Hash.ToLower() -ne 'dcb2719ef346dab5b609fcb193a5f13cfc4b0502e3f4de1ad43d349477402f47') {
            throw 'Mesa3D archive checksum mismatch'
          }
          $mesaRoot = Join-Path $env:RUNNER_TEMP "mesa3d-$mesaVersion"
          New-Item -ItemType Directory -Force -Path $mesaRoot | Out-Null
          7z e $mesaArchive 'x64\*' "-o$mesaRoot" -y
          Get-ChildItem -Path $mesaRoot -Recurse -File | Select-Object -ExpandProperty FullName
          "MESA_ROOT=$mesaRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev \
            libgtk-3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev \
            libwayland-dev libdecor-0-dev \
            xvfb

      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DFABRIC_BUILD_TESTS=ON -DFABRIC_BUILD_EDITORS=ON
          -DFABRIC_BUILD_RUNTIME=ON

      - name: Build
        run: cmake --build build --config Debug --parallel 4

      - name: Activate Windows software OpenGL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mesaOpenGl = Get-ChildItem -Path $env:MESA_ROOT -Recurse -File |
            Where-Object { $_.Name -ieq 'opengl32.dll' } | Select-Object -First 1
          if ($null -eq $mesaOpenGl) {
            throw "Mesa3D opengl32.dll not found under $env:MESA_ROOT"
          }
          $mesaDlls = @(Get-ChildItem -Path $mesaOpenGl.Directory.FullName -File |
            Where-Object { $_.Extension -ieq '.dll' })
          $testDirectories = @(Get-ChildItem -Path "$env:GITHUB_WORKSPACE\build" -Recurse -File |
            Where-Object { $_.Extension -ieq '.exe' } |
            ForEach-Object { $_.Directory.FullName } | Sort-Object -Unique)
          if ($testDirectories.Count -eq 0) {
            throw "No Windows test executables found under $env:GITHUB_WORKSPACE\build"
          }
          foreach ($testDirectory in $testDirectories) {
            Copy-Item $mesaDlls.FullName $testDirectory -Force
          }

      - name: Run CTest with virtual display
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ctest --test-dir build -C Debug --output-on-failure

      - name: Run CTest
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C Debug --output-on-failure
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: '1'

      - name: Upload Studio UI and E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-artifacts-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            build/**/*e2e-failure.txt
            build/**/*e2e-failure.ppm
            build/**/*asset-studio-ui-*.json
            build/**/*asset-studio-ui-*.ppm
            build/**/*asset-studio-vector-canvas-*.json
            build/**/*asset-studio-vector-canvas-*.ppm
            build/release-performance-smoke/*.json
            build/release-recovery-smoke/**/*
            build/_CPack_Packages/**/*
            build/*.tar.gz
            build/*.zip

  windows-native-gpu:
    name: windows-native-gpu
    if: ${{ inputs.native_gpu == true }}
    runs-on: [self-hosted, windows, gpu]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFABRIC_BUILD_TESTS=ON -DFABRIC_BUILD_EDITORS=ON -DFABRIC_BUILD_RUNTIME=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Debug --parallel 4

      - name: Run native GPU gate
        shell: pwsh
        env:
          FABRIC_REQUIRE_NATIVE_GL: '1'
        run: ctest --test-dir build -C Debug --output-on-failure

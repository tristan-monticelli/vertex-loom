name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up and validate starter
        run: npm run setup

      - name: Check whitespace
        run: git diff --check

      - name: Check POSIX hook syntax
        if: runner.os != 'Windows'
        run: sh -n .githooks/pre-commit .githooks/pre-push .githooks/commit-msg
